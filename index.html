    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #8ec8e0;
      }

      .sky {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #4aa3c8 0%, #8ec8de 48%, #e4f3f8 100%);
      }

      .flight {
        position: absolute;
        top: 42%;
        left: 0;
        width: 100%;
        height: 0;
        animation: fly 8s linear forwards;
      }

      .craft {
        position: absolute;
        left: -340px;
        top: -46px;
        display: flex;
        align-items: center;
      }

      .trail {
        width: 28vw;
        height: 3px;
        margin-right: -8px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85));
      }

      .plane {
        width: min(28vw, 280px);
        height: auto;
        filter: drop-shadow(0 14px 12px rgba(20, 50, 70, 0.2));
      }

      @keyframes fly {
        0% {
          transform: translateX(0) translateY(0);
        }
        100% {
          transform: translateX(calc(100vw + 380px)) translateY(-6vh);
        }
      }
    </style>
